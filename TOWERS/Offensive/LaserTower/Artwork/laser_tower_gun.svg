    <path d="M29 10L30.3 7.8H32V32L29.5 34Z" fill="#cbd6d9"/>
    <path d="M34.5 10L33.4 8H32.4V32.8L34.7 34Z" fill="#516775"/>
    <path d="M29.5 11L30.3 9H33.7L34.5 11V32H29.5Z" fill="#1c2b35" stroke="#8c9ca3" stroke-width=".65"/>
    <path d="M30.65 11H33.35V32H30.65Z" fill="url(#amber)"/>
    <path d="M31.55 11H32.45V31H31.55Z" fill="#fff3be"/>
    <!-- Angled cooling fins guard the lower barrel without making it stubby. -->
    <path d="M27.7 18L25 21V31L23.5 33L28.7 38L30 34L28.7 29Z" fill="url(#silver)" stroke="#263943" stroke-width="1.2"/>
    <path d="M36.3 18L39 21V31L40.5 33L35.3 38L34 34L35.3 29Z" fill="url(#edge)" stroke="#263943" stroke-width="1.2"/>
    <path d="M26.6 22L27.8 21V30L25.7 32Z" fill="#dfe8e8"/>
    <path d="M37.4 22L36.2 21V30L38.3 32Z" fill="#718792"/>
    <path d="M26.6 33L28.3 35M37.4 33L35.7 35" stroke="#f6c34b" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Small square emitter tip exactly follows the existing Muzzle Marker2D. -->
    <path d="M29.6 8V4.2L30.6 2.8H33.4L34.4 4.2V8Z" fill="#465660" stroke="#f4c557" stroke-width="1.1"/>
    <rect x="30.65" y="3.5" width="2.7" height="3.5" rx=".35" fill="#fff3ac"/>
    <path d="M29.1 13H34.9M29 29H35" stroke="#b9c6c7" stroke-width=".7"/>
  </g>
