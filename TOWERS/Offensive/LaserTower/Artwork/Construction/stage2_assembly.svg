<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2f1"/><stop offset=".28" stop-color="#9eabb4"/><stop offset=".6" stop-color="#5d707e"/><stop offset="1" stop-color="#b8c5cb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e1e5"/><stop offset=".52" stop-color="#82939e"/><stop offset="1" stop-color="#485c69"/>
    </linearGradient>
    <linearGradient id="darkRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d3d4a"/><stop offset=".48" stop-color="#899aa4"/><stop offset=".72" stop-color="#273743"/><stop offset="1" stop-color="#111f29"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a45f0b"/><stop offset=".3" stop-color="#ffc34b"/><stop offset=".58" stop-color="#fff0a8"/><stop offset="1" stop-color="#d89316"/>
    </linearGradient>
    <radialGradient id="reactor">
      <stop offset="0" stop-color="#fff7cc"/><stop offset=".42" stop-color="#ffe373"/><stop offset=".78" stop-color="#f8ad22"/><stop offset="1" stop-color="#8b500c"/>
    </radialGradient>
  </defs>
  <!-- Stationary silver circular siege chassis. Top-down and centred on the original 64px footprint. -->
  <g stroke-linejoin="round">
    <circle cx="32" cy="35" r="26" fill="#0a1017"/>
    <circle cx="32" cy="35" r="24.6" fill="#53616d" stroke="#b8c6cd" stroke-width="1.3"/>
    <circle cx="32" cy="35" r="22.2" fill="#263540" stroke="#17222c" stroke-width="2.1"/>
    <circle cx="32" cy="35" r="19.7" fill="#5c6d79" stroke="#91a2ad" stroke-width="1"/>
    <circle cx="32" cy="35" r="17.4" fill="#202d37" stroke="#101b23" stroke-width="1.5"/>
    <circle cx="32" cy="35" r="14" fill="#2d3e4b" stroke="#677c89" stroke-width="1"/>
    <circle cx="32" cy="35" r="10.2" fill="#101c26" stroke="#516570" stroke-width="1.3"/>

    <!-- Faceted armour panels form a segmented wheel rather than a flat disk. -->
    <path d="M10 26L13 19L21 12L27 11L26 17L17 26Z" fill="url(#silver)" stroke="#2c3a45" stroke-width="1.1"/>
    <path d="M54 26L51 19L43 12L37 11L38 17L47 26Z" fill="url(#silver)" stroke="#2c3a45" stroke-width="1.1"/>
    <path d="M9 29L13 25L18 28L19 42L14 46L9 42Z" fill="url(#edge)" stroke="#192832" stroke-width="1.5"/>
    <path d="M55 29L51 25L46 28L45 42L50 46L55 42Z" fill="url(#edge)" stroke="#192832" stroke-width="1.5"/>
    <path d="M12 48L19 43L27 50L27 56L21 57L15 53Z" fill="url(#silver)" stroke="#24343f" stroke-width="1.2"/>
    <path d="M52 48L45 43L37 50L37 56L43 57L49 53Z" fill="url(#silver)" stroke="#24343f" stroke-width="1.2"/>
    <path d="M28 55H36L42 58L38 60H26L22 58Z" fill="#70818d" stroke="#263743" stroke-width="1.2"/>
    <path d="M12 29L14 27L17 30V41L14 44L12 41Z M52 29L50 27L47 30V41L50 44L52 41Z" fill="#394a57"/>
    <path d="M17 17L22 14M47 17L42 14M16 51L21 54M48 51L43 54" stroke="#e0eaec" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M17 32V38M47 32V38" stroke="#152630" stroke-width="2.5"/>
    <path d="M16.5 34.8V38.1M47.5 34.8V38.1" stroke="#f4bf34" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M21 19L23 17M43 19L41 17M20 50L22 52M44 50L42 52" stroke="#ffcd59" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M28 13H36M26 57H38" stroke="#d7e0e0" stroke-width="1" stroke-linecap="round"/>
    <path d="M23 30L25 28M41 30L39 28M23 43L25 45M41 43L39 45" stroke="#7f929c" stroke-width="1.6"/>
    <circle cx="32" cy="35" r="7.2" fill="#293946" stroke="#c5d0d5" stroke-width="1.1"/>
    <circle cx="32" cy="35" r="4.5" fill="#182731" stroke="#8197a2" stroke-width="1"/>
  </g>
  <!-- Independent, up-facing, precision laser emitter. All detail stays within 64x64. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Rear reactor and concentric magnetic gimbal. -->
    <path d="M24 39L28 34H36L40 39V46L36 52H28L24 46Z" fill="#304451" stroke="#c5d1d6" stroke-width="1.25"/>
    <path d="M26 40L30 36H34L38 40V47L35 50H29L26 47Z" fill="#647780" stroke="#1b2b35" stroke-width="1"/>
    <circle cx="32" cy="43" r="8.5" fill="#1b2a34" stroke="#d2dce1" stroke-width="1.4"/>
    <circle cx="32" cy="43" r="6.2" fill="#465968" stroke="#15242f" stroke-width="1.1"/>
    <circle cx="32" cy="43" r="4.6" fill="#91712f" stroke="#e1af3e" stroke-width="1.2"/>
    <circle cx="32" cy="43" r="2.25" fill="#fff0a5"/>
    <path d="M25 41L23 38L23 32L27 30L30 35M39 41L41 38L41 32L37 30L34 35" fill="none" stroke="#1b2b35" stroke-width="3.1"/>
    <path d="M25 40L23 36L25 32M39 40L41 36L39 32" fill="none" stroke="#b4c2c7" stroke-width="1.4"/>
    <!-- Extremely long narrow central barrel, recessed light guide, and directional silver shroud. -->
    <path d="M27.6 31.5L28.4 11L29.9 7H34.1L35.6 11L36.4 31.5L34.5 36H29.5Z" fill="url(#darkRail)" stroke="#263540" stroke-width="1.4"/>
    <path d="M29 10L30.3 7.8H32V32L29.5 34Z" fill="#cbd6d9"/>
    <path d="M34.5 10L33.4 8H32.4V32.8L34.7 34Z" fill="#516775"/>
    <path d="M29.5 11L30.3 9H33.7L34.5 11V32H29.5Z" fill="#1c2b35" stroke="#8c9ca3" stroke-width=".65"/>
    <path d="M30.65 11H33.35V32H30.65Z" fill="#907239"/>
    <path d="M31.55 11H32.45V31H31.55Z" fill="#b9a76e"/>
    <!-- Angled cooling fins guard the lower barrel without making it stubby. -->
    <path d="M27.7 18L25 21V31L23.5 33L28.7 38L30 34L28.7 29Z" fill="url(#silver)" stroke="#263943" stroke-width="1.2"/>
    <path d="M36.3 18L39 21V31L40.5 33L35.3 38L34 34L35.3 29Z" fill="url(#edge)" stroke="#263943" stroke-width="1.2"/>
    <path d="M26.6 22L27.8 21V30L25.7 32Z" fill="#dfe8e8"/>
    <path d="M37.4 22L36.2 21V30L38.3 32Z" fill="#718792"/>
    <path d="M26.6 33L28.3 35M37.4 33L35.7 35" stroke="#f6c34b" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Small square emitter tip exactly follows the existing Muzzle Marker2D. -->
    <path d="M29.6 8V4.2L30.6 2.8H33.4L34.4 4.2V8Z" fill="#465660" stroke="#f4c557" stroke-width="1.1"/>
    <rect x="30.65" y="3.5" width="2.7" height="3.5" rx=".35" fill="#b0a276"/>
    <path d="M29.1 13H34.9M29 29H35" stroke="#b9c6c7" stroke-width=".7"/>
  </g>
  <!-- Stage 70: emitter assembled but energy alignment not calibrated. -->
  <g fill="none" stroke="#f5c55d" stroke-width=".9" stroke-dasharray="2 2">
    <path d="M23 16L27 12M41 16L37 12M22 46L26 49M42 46L38 49"/>
  </g>
</svg>
