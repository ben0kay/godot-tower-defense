    <path d="M8 39 27 39 35 44 27 49 8 49 3 44Z" fill="#080e14" stroke="#04070a" stroke-width="2.4"/>
    <path d="M8 51 27 51 35 56 27 61 8 61 3 56Z" fill="#080e14" stroke="#04070a" stroke-width="2.4"/>
    <path d="M7 42 18 42 23 44 18 46 7 46Z M7 54 18 54 23 56 18 58 7 58Z" fill="#ad2729"/>
    <path d="M5 43 13 43 15 44 13 45 5 45Z M5 55 13 55 15 56 13 57 5 57Z" fill="#ff6039"/>
