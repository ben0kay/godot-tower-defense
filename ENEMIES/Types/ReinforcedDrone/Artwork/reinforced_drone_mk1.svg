    <path d="M36 41 48 39 55 42 44 44Z M36 59 48 61 55 58 44 56Z M80 39 91 41 97 44 86 42Z M80 61 91 59 97 56 86 58Z" fill="#ad2729"/>
    <path d="M39 41 47 40 49 41 42 43Z M39 59 47 60 49 59 42 57Z" fill="#e74a32"/>
