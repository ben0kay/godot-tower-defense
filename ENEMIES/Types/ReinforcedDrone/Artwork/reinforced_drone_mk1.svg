    <path d="M100 43 127 43 151 50 127 57 100 57 113 50Z" fill="#090f15" stroke="#05080c" stroke-width="1.8"/>
    <path d="M104 47 127 46 143 50 127 54 104 53 116 50Z" fill="#ad2729"/>
    <path d="M115 49 132 50 115 51 111 50Z" fill="#ff6039"/>
