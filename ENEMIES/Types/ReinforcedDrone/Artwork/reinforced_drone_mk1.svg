    <path d="M17 43 42 32 74 33 103 39 153 50 103 61 74 67 42 68 17 57 26 50Z" fill="#1e252c" stroke="#05080c" stroke-width="3.7"/>
    <path d="M32 40 52 35 80 37 95 44 73 46 47 46Z" fill="#30363c" stroke="#0a1017" stroke-width="2"/>
    <path d="M32 60 52 65 80 63 95 56 73 54 47 54Z" fill="#30363c" stroke="#0a1017" stroke-width="2"/>
    <path d="M48 38 57 38 62 43 52 44Z M66 37 75 38 81 44 70 43Z M48 62 57 62 62 57 52 56Z M66 63 75 62 81 56 70 57Z" fill="#101820"/>
