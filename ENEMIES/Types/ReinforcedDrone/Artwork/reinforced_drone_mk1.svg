<svg xmlns="http://www.w3.org/2000/svg" width="40" height="30" viewBox="0 0 160 100">
  <!-- Reinforced Drone: plated +X fork-fighter related to Enemy001, in flat charcoal/scarlet fleet colours. -->
  <g stroke-linecap="round" stroke-linejoin="round">
