<svg xmlns="http://www.w3.org/2000/svg" width="52" height="38" viewBox="0 0 52 38">
<!-- Compact right-facing Gunner Drone. Weapon socket sits at (24,19), i.e. local (-2,0). -->
<defs>
 <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#71808a"/><stop offset=".3" stop-color="#354651"/><stop offset=".72" stop-color="#1a252e"/><stop offset="1" stop-color="#0a1118"/></linearGradient>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536471"/><stop offset=".58" stop-color="#23313b"/><stop offset="1" stop-color="#0d161e"/></linearGradient>
 <linearGradient id="engine"><stop stop-color="#ffc19b"/><stop offset=".36" stop-color="#d85e48"/><stop offset="1" stop-color="#612529"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
 <!-- Short, inward-swept stabilizers replace the old broad 64×48 gunship wings. -->
 <path d="M7 9L18 3L31 5L38 10L46 8L43 13L32 17L17 15Z M7 29L18 35L31 33L38 28L46 30L43 25L32 21L17 23Z" fill="url(#wing)" stroke="#778994" stroke-width=".9"/>
 <path d="M12 9L19 6L31 8L27 13L15 13Z M12 29L19 32L31 30L27 25L15 25Z" fill="#4b5e68"/>
 <path d="M19 7L22 13M19 31L22 25M29 8L31 13M29 30L31 25" stroke="#14222c" stroke-width="1.45"/>
 <!-- Light fuselage: pronounced needle nose with a small stern/engine. -->
 <path d="M7 12L22 10L36 13L49 19L36 25L22 28L7 26L3 22V16Z" fill="url(#hull)" stroke="#98a8b0" stroke-width="1.1"/>
 <path d="M14 14L25 12L35 15L43 19L35 23L25 26L14 24L10 19Z" fill="#1a2b35" stroke="#516875" stroke-width=".8"/>
 <path d="M38 16L47 19L38 22L41 19Z" fill="#83929b"/>
 <path d="M39 18L44 19L39 20" fill="none" stroke="#dc7668" stroke-width="1.1"/>
 <path d="M4 14H8V24H4Z" fill="#101b24" stroke="#4d5c67" stroke-width=".9"/>
 <path d="M5 15H7V23H5Z" fill="url(#engine)"/>
 <path d="M10 8L13 9M10 30L13 29M32 9L36 11M32 29L36 27" stroke="#c56a58" stroke-width="1.15"/>
 <!-- Keep the gun mount at the same local (-2,0) offset as the existing scene. -->
 <circle cx="24" cy="19" r="7.4" fill="#0d1820" stroke="#778b98" stroke-width="1.1"/>
 <circle cx="24" cy="19" r="5.2" fill="#2d414d" stroke="#415966" stroke-width=".7"/>
 <path d="M15 16L18 15M15 22L18 23M30 13L34 14M30 25L34 24" stroke="#a2b1b9" stroke-width=".8"/>
</g>
</svg>
