<svg xmlns="http://www.w3.org/2000/svg" width="72" height="48" viewBox="0 0 160 100">
  <!-- Shield Frigate: same broad forward-facing support hull, now flat charcoal/scarlet. -->
  <!-- Purple projector stays distinct from ordinary red-faction weapons. No gradients or filters. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Heavy rounded main hull, raised twin detector wings and sharp forward prow. -->
    <path d="M20 22Q10 50 20 78L88 86 127 68 151 50 127 32 88 14Z"
          fill="#111920" stroke="#05080c" stroke-width="3"/>
    <path d="M32 12L97 16 129 30 92 29 40 32Z"
          fill="#1e252c" stroke="#05080c" stroke-width="2.3"/>
    <path d="M32 88L97 84 129 70 92 71 40 68Z"
          fill="#1e252c" stroke="#05080c" stroke-width="2.3"/>
    <!-- Recessed structural bays and dark separation between the shield-facing nacelles. -->
    <path d="M39 20 70 19 85 28 49 29Z M39 80 70 81 85 72 49 71Z"
          fill="#30363c" stroke="#090e14" stroke-width="1.1"/>
    <path d="M70 18 96 21 109 28 88 27Z M70 82 96 79 109 72 88 73Z"
          fill="#101820"/>
    <path d="M98 27 127 31 142 44 121 39 103 35Z M98 73 127 69 142 56 121 61 103 65Z"
          fill="#0a1016" stroke="#05080c" stroke-width="1.5"/>
    <path d="M112 30 128 35 132 39 117 35Z M112 70 128 65 132 61 117 65Z"
          fill="#30363c"/>
    <!-- Flat scarlet fleet identification bands on the flanking protective wings. -->
    <path d="M49 18 68 19 73 22 55 22Z M49 82 68 81 73 78 55 78Z"
          fill="#ad2729"/>
    <path d="M52 19.5 66 20.5 M52 80.5 66 79.5" stroke="#ff6039" stroke-width="1.4"/>
    <path d="M107 31 119 34 125 38 113 35Z M107 69 119 66 125 62 113 65Z"
          fill="#ad2729"/>

    <!-- Foredeck preserves the large diamond-like prow and black centre trench. -->
    <path d="M63 37L124 36 145 50 124 64 63 63Z"
          fill="#293139" stroke="#05080c" stroke-width="2.2"/>
    <path d="M84 42 121 40 139 50 121 60 84 58 99 50Z"
          fill="#111820" stroke="#070d13" stroke-width="1.8"/>
    <path d="M96 46 123 45 134 50 123 55 96 54Z" fill="#090f15"/>
    <path d="M112 47 127 50 112 53 119 50Z" fill="#ad2729"/>
    <path d="M119 49 127 50 119 51Z" fill="#ff6039"/>

    <!-- Side armour and rear twin drive slots. -->
    <path d="M22 40 36 35 41 40 29 45Z M22 60 36 65 41 60 29 55Z" fill="#30363c"/>
    <path d="M14 38 29 39 34 45 26 49 14 47Z M14 62 29 61 34 55 26 51 14 53Z"
          fill="#0a1016" stroke="#05080c" stroke-width="1.7"/>
    <path d="M15 42 23 42 27 45 22 47 15 47Z M15 58 23 58 27 55 22 53 15 53Z"
          fill="#ad2729"/>
    <path d="M16 44 22 44 23 45 22 46 16 46Z M16 56 22 56 23 55 22 54 16 54Z"
          fill="#ff6039"/>

    <!-- Protected violet shield reactor: deliberately retained as support-ship identification. -->
    <circle cx="53" cy="50" r="23" fill="#070b12" stroke="#30363c" stroke-width="3"/>
    <circle cx="53" cy="50" r="19" fill="#0e1520" stroke="#141b22" stroke-width="2.6"/>
    <circle cx="53" cy="50" r="15.2" fill="#38264f" stroke="#9b77cb" stroke-width="1.8"/>
    <circle cx="53" cy="50" r="10.7" fill="#6e439d" stroke="#c397ed" stroke-width="2"/>
    <circle cx="53" cy="50" r="5.2" fill="#bc91ea"/>
    <circle cx="53" cy="50" r="2.4" fill="#f1e4ff"/>
    <path d="M38 37 43 34 48 34M38 63 43 66 48 66M59 34 65 37 68 42M59 66 65 63 68 58"
          fill="none" stroke="#30363c" stroke-width="3"/>
    <path d="M42 34 46 31M42 66 46 69" stroke="#ac82dc" stroke-width="1.7"/>
    <path d="M74 50 88 50" stroke="#a97cdb" stroke-width="2"/>
  </g>
</svg>
