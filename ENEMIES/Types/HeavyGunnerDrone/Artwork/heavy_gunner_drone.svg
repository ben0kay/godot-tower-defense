<svg xmlns="http://www.w3.org/2000/svg" width="62" height="42" viewBox="0 0 62 42">
<!-- Right-facing heavy sister ship to the 48x30 entry Gunner; socket (29,21) = local (-2,0). -->
<defs>
  <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#91a2a8"/><stop offset=".25" stop-color="#536773"/>
    <stop offset=".65" stop-color="#283944"/><stop offset="1" stop-color="#101b26"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6b7d87"/><stop offset=".48" stop-color="#344650"/>
    <stop offset="1" stop-color="#172532"/>
  </linearGradient>
  <linearGradient id="engine" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#ffdbb9"/><stop offset=".25" stop-color="#ff8c60"/>
    <stop offset=".7" stop-color="#b63d38"/><stop offset="1" stop-color="#431f28"/>
  </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- Armoured twin stabilizers, larger than the starter but recognisably from the same family. -->
  <path d="M8 13L19 4L33 5L44 11L55 8L52 15L40 19L18 18Z
           M8 29L19 38L33 37L44 31L55 34L52 27L40 23L18 24Z"
        fill="url(#wing)" stroke="#86969d" stroke-width="1.3"/>
  <path d="M13 13L22 7L34 9L43 14L30 17L17 16Z
           M13 29L22 35L34 33L43 28L30 25L17 26Z"
        fill="#485d6a" stroke="#718691" stroke-width=".7"/>
  <path d="M20 8L24 15M31 9L34 15M20 34L24 27M31 33L34 27"
        stroke="#182a34" stroke-width="2" fill="none"/>
  <path d="M39 12L51 10L48 15L40 17Z M39 30L51 32L48 27L40 25Z"
        fill="#182935" stroke="#758b94" stroke-width=".9"/>
  <!-- Reinforced extended core with heavy prow instead of fragile starter needle. -->
  <path d="M9 15L23 10L42 13L59 21L42 29L23 32L9 27L3 24V18Z"
        fill="url(#hull)" stroke="#a6b9bc" stroke-width="1.5"/>
  <path d="M14 16L26 13L41 16L53 21L41 26L26 29L14 26L9 21Z"
        fill="#20313d" stroke="#647c86" stroke-width="1.1"/>
  <path d="M15 17L22 14L25 16L18 20L12 20Z
           M15 25L22 28L25 26L18 22L12 22Z"
        fill="#617783" stroke="#99aeb3" stroke-width=".55"/>
  <path d="M43 17L56 21L43 25L46 21Z" fill="#99a9b0" stroke="#405662" stroke-width=".7"/>
  <path d="M45 19L52 21L45 23" fill="none" stroke="#d66d62" stroke-width="1.8"/>
  <!-- Two heavier armored engine exhaust ports. -->
  <path d="M3 14H10L12 17V25L10 28H3Z" fill="#15232e" stroke="#75838c" stroke-width="1.1"/>
  <path d="M4 16H7.3V19.4H4Z M4 22.6H7.3V26H4Z" fill="url(#engine)"/>
  <path d="M10 16L15 14M10 26L15 28M39 13L45 15M39 29L45 27"
        stroke="#cb6c5e" stroke-width="1.25"/>
  <path d="M17 11H31M17 31H31" stroke="#b0c0c1" stroke-width=".9" opacity=".65"/>
  <!-- Central reinforced rotating-gun mount at local (-2, 0). -->
  <circle cx="29" cy="21" r="10.6" fill="#101e28" stroke="#899eaa" stroke-width="1.5"/>
  <circle cx="29" cy="21" r="8" fill="#344956" stroke="#556d78" stroke-width="1.2"/>
  <circle cx="29" cy="21" r="5.2" fill="#192e3b" stroke="#7a929c" stroke-width=".8"/>
  <path d="M21 14L23 13M35 14L38 15M21 28L23 29M35 28L38 27"
        fill="none" stroke="#b2c2c2" stroke-width="1.1"/>
</g>
</svg>
