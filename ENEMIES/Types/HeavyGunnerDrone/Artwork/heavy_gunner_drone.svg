<svg xmlns="http://www.w3.org/2000/svg" width="62" height="42" viewBox="0 0 62 42">
<!-- Flat charcoal/scarlet repolish (2026-11-06), right-facing heavy sister ship to the 48x30 entry Gunner; socket (29,21) = local (-2,0). -->
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- Armoured twin stabilizers, larger than the starter but recognisably from the same family. -->
  <path d="M8 13L19 4L33 5L44 11L55 8L52 15L40 19L18 18Z
           M8 29L19 38L33 37L44 31L55 34L52 27L40 23L18 24Z"
        fill="#111920" stroke="#05080c" stroke-width="1.3"/>
  <path d="M13 13L22 7L34 9L43 14L30 17L17 16Z
           M13 29L22 35L34 33L43 28L30 25L17 26Z"
        fill="#30363c" stroke="#080d12" stroke-width=".7"/>
  <path d="M20 8L24 15M31 9L34 15M20 34L24 27M31 33L34 27"
        stroke="#090e14" stroke-width="2" fill="none"/>
  <path d="M39 12L51 10L48 15L40 17Z M39 30L51 32L48 27L40 25Z"
        fill="#101820" stroke="#05080c" stroke-width=".9"/>
  <!-- Reinforced extended core with heavy prow instead of fragile starter needle. -->
  <path d="M9 15L23 10L42 13L59 21L42 29L23 32L9 27L3 24V18Z"
        fill="#1e252c" stroke="#05080c" stroke-width="1.5"/>
  <path d="M14 16L26 13L41 16L53 21L41 26L26 29L14 26L9 21Z"
        fill="#111820" stroke="#090f15" stroke-width="1.1"/>
  <path d="M15 17L22 14L25 16L18 20L12 20Z
           M15 25L22 28L25 26L18 22L12 22Z"
        fill="#293139" stroke="#05080c" stroke-width=".55"/>
  <path d="M43 17L56 21L43 25L46 21Z" fill="#30363c" stroke="#05080c" stroke-width=".7"/>
  <path d="M45 19L52 21L45 23" fill="none" stroke="#ad2729" stroke-width="1.8"/>
  <!-- Two heavier armored engine exhaust ports. -->
  <path d="M3 14H10L12 17V25L10 28H3Z" fill="#0a1016" stroke="#05080c" stroke-width="1.1"/>
  <path d="M4 16H7.3V19.4H4Z M4 22.6H7.3V26H4Z" fill="#ad2729"/>
  <path d="M10 16L15 14M10 26L15 28M39 13L45 15M39 29L45 27"
        stroke="#ad2729" stroke-width="1.25"/>
  <path d="M17 11H31M17 31H31" stroke="#30363c" stroke-width=".9" opacity=".65"/>
  <!-- Heavy gunner's twin scarlet armour IDs, not a change in its 62x42 profile. -->
  <path d="M19 10 30 9 36 12 24 14Z M19 32 30 33 36 30 24 28Z" fill="#ad2729"/>
  <path d="M22 11 30 11.3M22 31 30 30.7" stroke="#ff6039" stroke-width=".95"/>
  <path d="M43 16 55 20 58 21 55 22 43 26 48 21Z" fill="#070d13"/>
  <path d="M47 19.4 54 21 47 22.6 49 21Z" fill="#ad2729"/>
  <path d="M49 20.6 54 21 49 21.4Z" fill="#ff6039"/>
  <path d="M5 17.1H7V18H5Z M5 24H7V24.9H5Z" fill="#ff6039"/>
  <!-- Central reinforced rotating-gun mount at local (-2, 0). -->
  <circle cx="29" cy="21" r="10.6" fill="#0a1016" stroke="#05080c" stroke-width="1.5"/>
  <circle cx="29" cy="21" r="8" fill="#293139" stroke="#080d12" stroke-width="1.2"/>
  <circle cx="29" cy="21" r="5.2" fill="#101820" stroke="#30363c" stroke-width=".8"/>
  <path d="M21 14L23 13M35 14L38 15M21 28L23 29M35 28L38 27"
        fill="none" stroke="#ad2729" stroke-width="1.1"/>
</g>
