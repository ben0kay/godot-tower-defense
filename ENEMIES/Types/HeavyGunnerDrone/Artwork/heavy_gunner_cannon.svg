<svg xmlns="http://www.w3.org/2000/svg" width="18" height="50" viewBox="0 0 18 50">
<!-- Flat charcoal/scarlet repolish (2026-11-06). Heavy turret centre (9,25), actual muzzle at (9,4), Marker2D(0,-21). -->
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- Longer, thicker single central autocannon barrel: distinct from starter's skinny tube. -->
  <path d="M6.3 29V7L7.6 4H10.4L11.7 7V29Z"
        fill="#111920" stroke="#05080c" stroke-width="1.0"/>
  <path d="M7.8 8V25" stroke="#30363c" stroke-width="1.1" opacity=".78"/>
  <path d="M10.1 8V25" stroke="#070d13" stroke-width="1"/>
  <path d="M6.4 4H11.6V7.2H6.4Z" fill="#101820" stroke="#30363c" stroke-width="1"/>
  <!-- Exposed side cooling conduits, not a wide flat blaster block. -->
  <path d="M4.2 13L5.7 10V28H4.2Z M12.3 10L13.8 13V28H12.3Z"
        fill="#293139" stroke="#05080c" stroke-width=".75"/>
  <path d="M3.2 17H14.8V20H3.2Z M3.2 25H14.8V28H3.2Z"
        fill="#30363c" stroke="#05080c" stroke-width=".9"/>
  <path d="M4.5 21H5.3M12.7 21H13.5" stroke="#ad2729" stroke-width="1"/>
  <!-- Reinforced scarlet firing bands across the heavy barrel and cooler housings. -->
  <path d="M6.2 14.6H11.8V16.3H6.2Z M4.2 26.3H13.8V27.2H4.2Z" fill="#ad2729"/>
  <path d="M7.3 15.1H10.8" stroke="#ff6039" stroke-width=".8"/>
  <!-- Compact but armoured breech, rotor and stabilizer. -->
  <path d="M3.8 28L6.1 26H11.9L14.2 28L16 34L14.8 42L12 45H6L3.2 42L2 34Z"
        fill="#1e252c" stroke="#05080c" stroke-width="1.2"/>
  <path d="M5 30H13L14.2 36L12 40H6L3.8 36Z" fill="#101820" stroke="#293139" stroke-width=".75"/>
  <path d="M2.4 34L5 36V40L3.1 39Z M15.6 34L13 36V40L14.9 39Z" fill="#ad2729"/>
  <circle cx="9" cy="37.1" r="5.3" fill="#0a1016" stroke="#05080c" stroke-width="1.3"/>
  <circle cx="9" cy="37.1" r="3.1" fill="#293139" stroke="#080d12" stroke-width=".8"/>
  <circle cx="9" cy="37.1" r="1.7" fill="#ad2729" stroke="#05080c" stroke-width=".7"/>
  <path d="M6 45H12L12.8 48H5.2Z" fill="#101820" stroke="#05080c" stroke-width=".9"/>
  <path d="M6.5 47H11.5" stroke="#ff6039" stroke-width="1.3"/>
</g>
</svg>
