  <circle cx="9" cy="37.1" r="5.3" fill="#112734" stroke="#a3bfc5" stroke-width="1.3"/>
  <circle cx="9" cy="37.1" r="3.1" fill="#4e6c75" stroke="#c1d0cc" stroke-width=".8"/>
  <circle cx="9" cy="37.1" r="1.7" fill="#e4876c" stroke="#712e2c" stroke-width=".7"/>
  <path d="M6 45H12L12.8 48H5.2Z" fill="#476571" stroke="#a1bbc2" stroke-width=".9"/>
  <path d="M6.5 47H11.5" stroke="#f0a085" stroke-width="1.3"/>
