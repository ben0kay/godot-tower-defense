<svg xmlns="http://www.w3.org/2000/svg" width="18" height="50" viewBox="0 0 18 50">
<!-- Heavy turret centre (9,25), actual muzzle at (9,4), Marker2D(0,-21). -->
<defs>
  <linearGradient id="armour" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#cedee0"/><stop offset=".32" stop-color="#859eaa"/>
    <stop offset=".67" stop-color="#496473"/><stop offset="1" stop-color="#253947"/>
  </linearGradient>
  <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#142330"/><stop offset=".3" stop-color="#708b99"/>
    <stop offset=".57" stop-color="#d1e0dd"/><stop offset="1" stop-color="#152f40"/>
  </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- Longer, thicker single central autocannon barrel: distinct from starter's skinny tube. -->
  <path d="M6.3 29V7L7.6 4H10.4L11.7 7V29Z"
        fill="url(#barrel)" stroke="#071d2b" stroke-width="1.0"/>
  <path d="M7.8 8V25" stroke="#d6e9e6" stroke-width="1.1" opacity=".78"/>
