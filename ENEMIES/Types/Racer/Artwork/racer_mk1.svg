    <path d="M2 45 24 44 35 50 24 56 2 55 0 50Z" fill="#090f15" stroke="#04070a" stroke-width="2.4"/>
    <path d="M8 47 22 46 27 50 22 54 8 53Z" fill="#30363c"/>
