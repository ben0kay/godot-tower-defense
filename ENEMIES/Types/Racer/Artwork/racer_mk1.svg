    <path d="M38 44 63 41 83 45 61 47 36 47Z M38 56 63 59 83 55 61 53 36 53Z" fill="#30363c" stroke="#0a1017" stroke-width="1.2"/>
    <path d="M62 46 85 46 97 50 85 54 62 54 73 50Z" fill="#0b131a"/>
    <path d="M66 48 85 48 91 50 85 52 66 52 75 50Z" fill="#283038"/>
