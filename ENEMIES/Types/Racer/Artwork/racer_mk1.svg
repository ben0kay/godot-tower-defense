    <path d="M5 65 30 67 52 59 46 54 20 56 2 60Z" fill="#151d25" stroke="#05080c" stroke-width="2.8"/>
    <path d="M10 37 29 36 43 41 28 42Z M10 63 29 64 43 59 28 58Z" fill="#30363c"/>
