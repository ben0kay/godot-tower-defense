<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Shared pre-baked shield: dense glowing perimeter, translucent core and static electric veins.
       Authored in white so ShieldVisualStyle.Tint can recolour it for future enemies/towers.
       No blur filter, shader, animation or per-frame geometry is required. -->
  <defs>
    <!-- Strong visible shell around the outer 15-20% with a low-opacity inner field. -->
    <radialGradient id="barrier" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.49"/>
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="89%" stop-color="#ffffff" stop-opacity="0.56"/>
      <stop offset="96%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full translucent field (not a hollow outline). -->
  <circle cx="64" cy="64" r="63" fill="url(#barrier)"/>

  <!-- Baked soft outer corona: three wide translucent rings simulate glow without a filter. -->
  <circle cx="64" cy="64" r="50.5" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="25"/>
  <circle cx="64" cy="64" r="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="15"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.54" stroke-width="7.5"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.93" stroke-width="2.7"/>

  <!-- A few imperfect inner field traces keep the shield from reading as a simple HUD circle. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round"
     stroke-opacity="0.29" stroke-width="1.8">
    <path d="M23 45 L30 35 L43 29 L49 26"/>
    <path d="M78 24 L91 30 L101 40 L106 48"/>
    <path d="M108 78 L101 91 L90 101 L81 106"/>
    <path d="M48 105 L35 98 L27 87 L23 77"/>
    <path d="M34 64 L41 56 L51 58"/>
    <path d="M78 72 L87 66 L94 70"/>
  </g>

  <!-- Angular energy arcs, partly wrapping the circular rim. First a broad glow... -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.29" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 35 L35 31 L34 42 L43 40 L45 47"/>
    <path d="M69 12 L75 20 L85 19 L87 29 L95 31"/>
    <path d="M109 51 L103 58 L112 64 L102 70 L106 79"/>
    <path d="M91 102 L83 97 L76 109 L68 104 L61 114"/>
    <path d="M20 76 L28 70 L21 64 L30 58 L26 49"/>
  </g>

  <!-- ...then hot filaments on top, still static and baked into the one texture. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.96" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 35 L35 31 L34 42 L43 40 L45 47"/>
    <path d="M69 12 L75 20 L85 19 L87 29 L95 31"/>
    <path d="M109 51 L103 58 L112 64 L102 70 L106 79"/>
    <path d="M91 102 L83 97 L76 109 L68 104 L61 114"/>
    <path d="M20 76 L28 70 L21 64 L30 58 L26 49"/>
  </g>

  <!-- Localized bright contact nodes on the energy barrier. -->
  <g fill="#ffffff">
    <circle cx="35" cy="31" r="2.3" fill-opacity="0.95"/>
    <circle cx="85" cy="19" r="1.8" fill-opacity="0.9"/>
    <circle cx="112" cy="64" r="2.1" fill-opacity="0.95"/>
    <circle cx="76" cy="109" r="1.8" fill-opacity="0.9"/>
  </g>
</svg>
