<!-- Citadel MK I, top-down: a single cached 192px sprite within the unchanged 3x3 world footprint.
     Four clear corner hardpoints are decoration, not guns or physical mount markers. -->
<defs>
  <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#738ea1"/><stop offset=".24" stop-color="#344b5c"/>
    <stop offset=".62" stop-color="#1a3041"/><stop offset="1" stop-color="#415969"/>
  </linearGradient>
  <linearGradient id="facet" x1="0" y1="0" x2=".9" y2="1">
    <stop stop-color="#566f80"/><stop offset=".44" stop-color="#253c4b"/>
    <stop offset="1" stop-color="#102736"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#b6c6d0"/><stop offset=".35" stop-color="#537083"/>
    <stop offset="1" stop-color="#243849"/>
  </linearGradient>
  <radialGradient id="core" cx=".46" cy=".42" r=".64">
    <stop stop-color="#f2ffff"/><stop offset=".19" stop-color="#affff5"/>
    <stop offset=".48" stop-color="#36d9db"/><stop offset=".78" stop-color="#096d85"/>
    <stop offset="1" stop-color="#072733"/>
  </radialGradient>
</defs>
